name: build-runpod-image

# Build + push the BlockQuant pre-baked RunPod image to GHCR, and to Docker Hub
# when DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are set. RunPod community hosts do
# not pull from ghcr.io, so RUNPOD_IMAGE points at the Docker Hub copy.
#
# Triggered on:
#   - push of any tag matching v*.*.*    (e.g. v0.1.0)  — produces :v0.1.0 + :latest
#   - manual dispatch                                    — produces :sha-{shortsha}
#
# Image lands at: ghcr.io/honkware/blockquant, docker.io/<DOCKERHUB_USERNAME>/blockquant
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag for manual builds"
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Empty unless both secrets are set, so half a setup skips Docker Hub
      # instead of failing the login.
      HUB_USER: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME || '' }}
    steps:
      - uses: actions/checkout@v4

      # torch alone is ~4.5 GB compressed; a stock runner is tight once the
      # layers are unpacked and exported.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/blockquant
            name=docker.io/${{ env.HUB_USER }}/blockquant,enable=${{ env.HUB_USER != '' }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=sha-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=BlockQuant RunPod
            org.opencontainers.image.description=Pre-baked ExLlamaV3 quantization image for RunPod pods.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.runpod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "## Built image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags:" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/;s/$/`/' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with: \`docker pull ghcr.io/${{ github.repository_owner }}/blockquant:latest\`" >> $GITHUB_STEP_SUMMARY
