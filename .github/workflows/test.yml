name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  python:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lightweight test deps
        # Skip torch / heavy ML deps — the tests are fully mocked against
        # runpod / paramiko / huggingface-hub and don't need a GPU stack.
        # pillow is not that: catbench_store really opens the PNGs it mirrors,
        # and test_catbench_store builds real ones to feed it.
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio python-dotenv celery \
                      runpod paramiko huggingface-hub pydantic fastapi pillow

      - name: Run tests
        working-directory: backend
        run: pytest tests -v --tb=short
