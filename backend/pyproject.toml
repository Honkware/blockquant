[project]
name = "blockquant-backend"
version = "0.1.0"
description = "BlockQuant Python backend — multi-format quantization pipeline"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.21.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "tenacity>=8.0",
    "requests>=2.31",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "celery>=5.3",
    "redis>=5.0",
    # ML / quantization runtime deps
    "torch>=2.0",
    "numpy>=1.24",
    "tokenizers>=0.20",
    "transformers>=4.40",
    "safetensors>=0.4",
    "Pillow>=10.0",
    "marisa-trie>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "ruff"]

[project.scripts]
bq-pipeline = "blockquant.__main__:main"
[tool.pytest.ini_options]
# src layout: the package is not installed when running the suite from a
# checkout, and without this every test that imports blockquant fails on
# collection while the ones that don't quietly pass.
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: needs a GPU, a network fetch, or minutes of wall clock"]
